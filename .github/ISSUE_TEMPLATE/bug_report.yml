name: Bug Report
description: Report an issue or unexpected behavior in PocketMoney
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible.
  - type: input
    id: version
    attributes:
      label: LNbits & PocketMoney Version
      description: What version of LNbits and PocketMoney are you running?
      placeholder: "e.g. LNbits v1.6.2, PocketMoney v0.1.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Create plan with...
        2. Set schedule to...
        3. Trigger "Pay Now"...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Server Logs / Traceback
      description: Relevant logs from LNbits or browser console.
      render: shell
