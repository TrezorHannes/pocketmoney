name: Feature Request
description: Suggest an idea or enhancement for PocketMoney
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make PocketMoney better? We would love to hear it!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement or Use Case
      description: Is your feature request related to a specific problem or workflow?
      placeholder: "e.g. As a node operator, I want to..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you would like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you have considered.
