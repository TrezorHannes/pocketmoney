<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bgGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0D15" />
      <stop offset="50%" stop-color="#121826" />
      <stop offset="100%" stop-color="#1D263B" />
    </linearGradient>

    <!-- Squircle Border Shimmer -->
    <linearGradient id="borderGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03" />
    </linearGradient>

    <!-- Outer Coin Rim Gold Gradient -->
    <linearGradient id="coinRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="35%" stop-color="#FBBF24" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Coin Body Metallic Base -->
    <linearGradient id="coinBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Inner Vault Chamber Gradient -->
    <radialGradient id="innerVaultGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A2438" />
      <stop offset="100%" stop-color="#0B101A" />
    </radialGradient>

    <!-- Cadence Sweep Arc Gradient -->
    <linearGradient id="cadenceSweepGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Lightning Bolt Core Gradient -->
    <linearGradient id="boltGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="30%" stop-color="#FDE68A" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Chiseled Bolt Shading Highlight -->
    <linearGradient id="boltHighlightB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowFilterB" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="ambientGlowB" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" />
    </filter>
  </defs>

  <!-- Base Icon Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGradB)" stroke="url(#borderGradB)" stroke-width="2.5" />

  <!-- Soft Ambient Warmth Behind Coin -->
  <circle cx="256" cy="256" r="145" fill="#F59E0B" opacity="0.1" filter="url(#ambientGlowB)" />

  <!-- CALENDAR CADENCE TRACK & TICK MARKS -->
  <g id="calendar-cadence">
    <!-- Chrono Outer Reference Ring -->
    <circle cx="256" cy="256" r="192" fill="none" stroke="#1E293B" stroke-width="2.5" opacity="0.7" />

    <!-- Active Cadence Countdown Arc (9 o'clock to 12 o'clock trigger) -->
    <path d="M 64 256 A 192 192 0 0 1 256 64" fill="none" stroke="url(#cadenceSweepGrad)" stroke-width="4.5" stroke-linecap="round" />

    <!-- Cardinal Cadence Ticks (12, 3, 6, 9 o'clock) -->
    <line x1="256" y1="64" x2="256" y2="82" stroke="#FBBF24" stroke-width="4" stroke-linecap="round" />
    <line x1="430" y1="256" x2="448" y2="256" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round" />
    <line x1="256" y1="430" x2="256" y2="448" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round" />
    <line x1="64" y1="256" x2="82" y2="256" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" />

    <!-- Intermediate Cadence Ticks (30° Interval Clock) -->
    <line x1="347" y1="98" x2="353" y2="89" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <line x1="414" y1="165" x2="423" y2="159" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <line x1="414" y1="347" x2="423" y2="353" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <line x1="347" y1="414" x2="353" y2="423" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <line x1="165" y1="414" x2="159" y2="423" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <line x1="98" y1="347" x2="89" y2="353" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <line x1="98" y1="165" x2="89" y2="159" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    <line x1="165" y1="98" x2="159" y2="89" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />

    <!-- Trigger Beacon at 12 o'clock -->
    <circle cx="256" cy="64" r="6.5" fill="#F59E0B" filter="url(#glowFilterB)" />
    <circle cx="256" cy="64" r="11" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.6" />
  </g>

  <!-- MODERN VAULT-COIN -->
  <g id="vault-coin">
    <!-- Outer Golden Coin Rim -->
    <circle cx="256" cy="256" r="148" fill="url(#coinBodyGrad)" stroke="url(#coinRimGrad)" stroke-width="5" />

    <!-- Inner Vault Chamber -->
    <circle cx="256" cy="256" r="124" fill="url(#innerVaultGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

    <!-- Vault Gear / Notches Ring -->
    <circle cx="256" cy="256" r="106" fill="none" stroke="rgba(245, 158, 11, 0.35)" stroke-width="2.5" stroke-dasharray="8 14" />

    <!-- Allowance / Piggy Bank Intake Slot -->
    <rect x="216" y="156" width="80" height="14" rx="7" fill="#090D15" stroke="url(#coinRimGrad)" stroke-width="2" />
    <rect x="220" y="160" width="72" height="6" rx="3" fill="#000000" />
  </g>

  <!-- DYNAMIC LIGHTNING BOLT -->
  <g id="vault-bolt">
    <!-- Diffuse Backlight Glow -->
    <polygon points="270,166 218,265 256,265 238,368 294,250 256,250" 
             fill="#F59E0B" 
             opacity="0.45" 
             filter="url(#glowFilterB)" />

    <!-- Solid Vector Bolt -->
    <polygon points="270,166 218,265 256,265 238,368 294,250 256,250" 
             fill="url(#boltGradB)" 
             stroke="#FFFBEB" 
             stroke-width="1.8" 
             stroke-linejoin="round" />

    <!-- Chiseled Edge Shading Highlight -->
    <polygon points="270,166 218,265 256,265 246,310 256,250" 
             fill="url(#boltHighlightB)" />
  </g>
</svg>
