<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bgGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#111726" />
      <stop offset="100%" stop-color="#1A2338" />
    </linearGradient>

    <!-- Squircle Border Shimmer -->
    <linearGradient id="borderGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03" />
    </linearGradient>

    <!-- Pocket Interior Gradient -->
    <linearGradient id="pocketBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E283C" />
      <stop offset="100%" stop-color="#101725" />
    </linearGradient>

    <!-- Pocket Contour Gradient Stroke -->
    <linearGradient id="pocketStrokeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Recurrence Orbit Gradient -->
    <linearGradient id="recurrenceGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Lightning Bolt Core Gradient -->
    <linearGradient id="boltGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FDE68A" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Lightning Bolt Facet Highlight -->
    <linearGradient id="boltFacetA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowFilterA" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="ambientGlowA" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26" />
    </filter>
  </defs>

  <!-- Base Icon Squircle (Scaleable for app store & tiles) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGradA)" stroke="url(#borderGradA)" stroke-width="2.5" />

  <!-- Soft Ambient Warmth Behind Pocket -->
  <circle cx="256" cy="270" r="140" fill="#F59E0B" opacity="0.12" filter="url(#ambientGlowA)" />

  <!-- RECURRENCE ORBIT & CADENCE NODES -->
  <g id="recurrence-cycle">
    <!-- Faint Full Circular Orbit Track -->
    <circle cx="256" cy="260" r="172" fill="none" stroke="#1E293B" stroke-width="5" opacity="0.6" />

    <!-- Active Recurring Cycle Sweeping Clockwise -->
    <path d="M 172 408 A 172 172 0 1 1 340 408" fill="none" stroke="url(#recurrenceGrad)" stroke-width="6.5" stroke-linecap="round" />

    <!-- Recurrence Forward Arrowhead -->
    <polygon points="334,424 352,404 326,396" fill="#F59E0B" />

    <!-- Rhythmic Cadence Nodes (Weekly/Monthly Schedule Pulses) -->
    <!-- Week 1 / Cadence Start -->
    <circle cx="107" cy="346" r="6" fill="#38BDF8" />
    <!-- Week 2 -->
    <circle cx="107" cy="174" r="7.5" fill="#60A5FA" />
    <!-- Week 3 -->
    <circle cx="256" cy="88" r="8.5" fill="#818CF8" />
    <!-- Week 4 / Payout Event -->
    <circle cx="405" cy="174" r="10" fill="#FBBF24" filter="url(#glowFilterA)" />
  </g>

  <!-- GEOMETRIC POCKET CONTAINER -->
  <g id="pocket-vessel">
    <!-- Pocket Body -->
    <path d="M 160 190 
             C 160 180, 168 172, 178 172 
             L 334 172 
             C 344 172, 352 180, 352 190 
             L 352 292 
             C 352 304, 345 316, 335 324 
             L 264 380 
             C 259 384, 253 384, 248 380 
             L 177 324 
             C 167 316, 160 304, 160 292 
             Z" 
          fill="url(#pocketBgGrad)" 
          stroke="url(#pocketStrokeGrad)" 
          stroke-width="3.5" />

    <!-- Top Lip Hem Bar -->
    <line x1="172" y1="172" x2="340" y2="172" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round" />

    <!-- Precision Geometric Stitch Accent -->
    <line x1="178" y1="206" x2="334" y2="206" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round" opacity="0.45" />

    <!-- Minimalist Rivet Accents -->
    <circle cx="180" cy="206" r="4.5" fill="#FBBF24" stroke="#78350F" stroke-width="1.5" />
    <circle cx="332" cy="206" r="4.5" fill="#FBBF24" stroke="#78350F" stroke-width="1.5" />
  </g>

  <!-- CENTRAL LIGHTNING BOLT -->
  <g id="lightning-strike">
    <!-- Diffuse Backlight Glow -->
    <polygon points="268,136 226,252 260,252 242,352 286,242 254,242" 
             fill="#F59E0B" 
             opacity="0.4" 
             filter="url(#glowFilterA)" />

    <!-- Solid Vector Bolt -->
    <polygon points="268,136 226,252 260,252 242,352 286,242 254,242" 
             fill="url(#boltGradA)" 
             stroke="#FFFBEB" 
             stroke-width="1.8" 
             stroke-linejoin="round" />

    <!-- Chiseled Edge Highlight Facet -->
    <polygon points="268,136 226,252 260,252 248,290 258,242" 
             fill="url(#boltFacetA)" />
  </g>
</svg>
